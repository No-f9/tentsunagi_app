<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFF6E6">
<meta name="apple-mobile-web-app-title" content="点つなぎ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>点つなぎ</title>
<style>
:root{
  --bg:#FFF6E6;--card:#FFFFFF;--ink:#2B2D42;--soft:#7A7F95;--dot:#55648A;
  --accent:#FF8A3D;--accent-d:#E2691A;--good:#2FA36B;--good-d:#1F7A4E;
  --bad:#E5484D;--miss:#2F7BEA;--erase:#D45C9E;--line:#EADFC9;--sand:#F4EAD8;
  --flip:#7B61FF;--mirror:#14A3B8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  overscroll-behavior:none;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none;padding:0}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 12px)
          calc(env(safe-area-inset-bottom) + 10px) calc(env(safe-area-inset-left) + 12px)}
.screen{display:none;flex:1;min-height:0;flex-direction:column;gap:8px}
.screen.on{display:flex}
.icon-btn{flex:none;width:52px;height:52px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:24px;display:grid;place-items:center}

/* ===== ホーム ===== */
#home{align-items:center;justify-content:center}
.home-wrap{width:100%;max-width:720px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;justify-content:center;gap:14px}
.brand svg{width:64px;height:64px;border-radius:16px}
.brand h1{font-size:40px;margin:0;letter-spacing:.08em}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mode{position:relative;border-radius:20px;background:var(--card);border:3px solid var(--line);min-height:84px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 4px 0 #EFE3CB}
.mode .mk{font-size:24px;font-weight:900;line-height:1.1}
.mode .ms{font-size:12px;color:var(--soft);font-weight:700}
.mode .ar{font-size:22px;line-height:1}
.mode.on{border-color:var(--accent);background:#FFF0E3}
.mode.on[data-m=flip]{border-color:var(--flip);background:#F1EEFF}
.mode.on[data-m=mirror]{border-color:var(--mirror);background:#E8F8FA}
.mode.locked{opacity:.55}
.mode .lock{position:absolute;top:6px;right:10px;font-size:16px}
.main-card{width:100%;text-align:left;background:var(--card);border-radius:28px;border:3px solid #F6C9A3;padding:18px 20px;
  box-shadow:0 6px 0 #F3DCC2;display:flex;flex-direction:column;gap:12px}
.main-card:active{transform:translateY(3px);box-shadow:0 3px 0 #F3DCC2}
.mc-top{display:flex;align-items:baseline;gap:12px}
.mc-k{font-size:26px;font-weight:900}
.mc-lv{font-size:20px;font-weight:800;color:var(--accent-d)}
.mc-go{align-self:flex-end;background:var(--accent);color:#fff;font-weight:900;font-size:24px;border-radius:999px;padding:12px 34px;box-shadow:0 4px 0 var(--accent-d)}
.stamps{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.stamps .slot{max-width:none;font-size:clamp(14px,3.4vw,28px)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sub-card{position:relative;background:var(--card);border-radius:22px;border:3px solid var(--line);padding:14px;min-height:96px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:22px;font-weight:900;box-shadow:0 4px 0 #EFE3CB}
.sub-card:active{transform:translateY(3px);box-shadow:0 1px 0 #EFE3CB}
.sub-card .ic{font-size:30px;line-height:1.1}
.sub-card small{font-size:12px;color:var(--soft);font-weight:700}
.badge{position:absolute;top:-8px;right:-6px;background:var(--bad);color:#fff;border-radius:999px;min-width:32px;height:32px;
  padding:0 8px;display:grid;place-items:center;font-size:16px;font-weight:900;border:3px solid var(--bg)}
.badge:empty{display:none}
.parent{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:4px;flex-wrap:wrap}
.parent span{font-size:13px;color:var(--soft);font-weight:700}
.pbtn{background:var(--sand);border-radius:999px;padding:10px 18px;font-size:15px;font-weight:800;min-height:44px}

/* ===== 練習 ===== */
.phead{display:flex;align-items:center;gap:10px}
.ptitle{flex:1;min-width:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ptitle b{font-size:24px;white-space:nowrap}
.chip{font-size:14px;font-weight:800;border-radius:999px;padding:5px 12px;background:var(--sand);white-space:nowrap}
.chip[data-m=flip]{background:var(--flip);color:#fff}
.chip[data-m=mirror]{background:var(--mirror);color:#fff}
#prog{display:flex;gap:4px;justify-content:center;min-height:30px}
.slot{flex:0 1 30px;max-width:30px;aspect-ratio:1;border-radius:50%;background:#F2E7D3;
  display:grid;place-items:center;font-size:clamp(9px,2.3vw,19px);line-height:1}
.slot.got{background:#FFE2C7}
.slot.pop{animation:pop .7s}
.drill-left{font-size:16px;font-weight:800;color:var(--soft);align-self:center}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#stage.land{flex-direction:row;gap:24px}
.board{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.tagrow{display:flex;gap:8px;align-items:center;height:24px}
.tag{font-size:13px;font-weight:800;color:var(--soft);background:var(--sand);border-radius:999px;padding:3px 12px;line-height:18px}
.tag.erase{background:var(--erase);color:#fff}
.tag.howto{color:#fff}
.tag.howto[data-m=flip]{background:var(--flip)}
.tag.howto[data-m=mirror]{background:var(--mirror)}
.card{position:relative;background:var(--card);border-radius:22px;border:3px solid var(--line);box-shadow:0 4px 0 #EFE3CB}
#smp[data-m=flip]{border-color:#C9BDFF}
#smp[data-m=mirror]{border-color:#A3DEE7}
#ans{border-color:#F6C9A3}
#ans.erasing{border-color:var(--erase);border-style:dashed}
svg{display:block;width:100%;height:100%;touch-action:none}
#toolbar{display:grid;grid-template-columns:1fr 1fr 1.8fr;gap:10px}
.tb{border-radius:20px;font-weight:800;font-size:15px;min-height:76px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 #E8DBC2}
.tb .ic{font-size:28px;line-height:1;height:30px;display:grid;place-items:center}
.tb:active{transform:translateY(3px);box-shadow:0 1px 0 #E8DBC2}
.tb.on{background:var(--erase);color:#fff;border-color:var(--erase);box-shadow:0 4px 0 #A9407A}
#done{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 0 var(--accent-d);font-size:22px}
#done:active{box-shadow:0 1px 0 var(--accent-d)}

/* ===== 一覧ページ（おさらい・きろく・せってい） ===== */
.page-head{display:flex;align-items:center;gap:12px}
.page-head h2{margin:0;font-size:24px}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:4px 2px 24px}
.inner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.lvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.lvbtn{background:var(--card);border:3px solid var(--line);border-radius:18px;min-height:100px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;font-weight:900;font-size:18px;box-shadow:0 4px 0 #EFE3CB}
.lvbtn span{font-size:36px;line-height:1}
.lvbtn small{font-size:11px;color:var(--soft);font-weight:700}
.empty{background:var(--card);border-radius:22px;padding:28px;text-align:center;font-size:20px;font-weight:800;color:var(--soft)}
.panel{background:var(--card);border-radius:20px;border:2px solid var(--line);padding:16px 18px}
.panel h3{margin:0 0 10px;font-size:17px}
.panel p{margin:6px 0;font-size:14px;line-height:1.6;color:var(--soft);-webkit-user-select:text;user-select:text}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:var(--card);border-radius:18px;border:2px solid var(--line);padding:12px 14px}
.kpi b{display:block;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--soft);font-weight:700}
.bars{display:flex;flex-direction:column;gap:5px}
.bar-row{display:grid;grid-template-columns:52px minmax(0,1fr) 72px;align-items:center;gap:8px;font-size:13px;font-weight:700}
.bar-row .lbl{color:var(--soft);font-variant-numeric:tabular-nums}
.bar-track{height:16px;background:#F6EFE2;border-radius:999px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:999px}
.bar-row .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--soft);font-size:12px}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.set-row .l{font-weight:800;font-size:16px}
.set-row .l small{display:block;font-size:12px;color:var(--soft);font-weight:600}
.seg{display:flex;background:var(--sand);border-radius:999px;padding:4px;gap:4px}
.seg button{border-radius:999px;padding:8px 16px;font-weight:800;font-size:15px;min-height:44px}
.seg button.on{background:var(--card);box-shadow:0 2px 0 var(--line)}
.btn{border-radius:14px;padding:12px 18px;font-weight:800;font-size:16px;min-height:48px;background:var(--sand)}
.btn.warn{background:#FCE3E4;color:#B4232A}
.btn.pri{background:var(--accent);color:#fff}
.btns{display:flex;gap:10px;flex-wrap:wrap}

/* ===== ユーザー ===== */
.who{align-self:center;display:flex;align-items:center;gap:12px;background:var(--card);border:3px solid var(--line);border-radius:999px;
  padding:6px 20px 6px 6px;box-shadow:0 4px 0 #EFE3CB;min-height:64px}
.who:active{transform:translateY(3px);box-shadow:0 1px 0 #EFE3CB}
.who b{font-size:22px}
.who small{font-size:13px;color:var(--soft);font-weight:800}
.av{flex:none;width:52px;height:52px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-weight:900;font-size:22px;color:#fff;background:var(--accent)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.xl{width:128px;height:128px;font-size:52px}
.av.sm{width:30px;height:30px;font-size:14px}
#who{align-items:center;justify-content:center}
.who-wrap{width:100%;max-width:820px;display:flex;flex-direction:column;gap:28px;align-items:center}
.who-wrap h2{font-size:34px;margin:0}
.who-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;width:100%}
.who-tile{background:var(--card);border:3px solid var(--line);border-radius:28px;padding:20px 16px 16px;width:184px;display:flex;flex-direction:column;
  align-items:center;gap:12px;font-size:22px;font-weight:900;box-shadow:0 5px 0 #EFE3CB;word-break:break-all}
.who-tile.on{border-color:var(--accent)}
.who-tile:active{transform:translateY(3px);box-shadow:0 2px 0 #EFE3CB}
.ucard{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.ucard .av{width:76px;height:76px;font-size:32px}
.photo-btn{flex:none;position:relative}
.photo-btn::after{content:'📷';position:absolute;right:-4px;bottom:-4px;font-size:18px;background:#fff;border-radius:50%;width:30px;height:30px;
  display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.ubody{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.uname{font:inherit;font-size:18px;font-weight:800;border:2px solid var(--line);border-radius:12px;padding:8px 12px;width:100%;max-width:300px;
  touch-action:auto;background:#fff;color:var(--ink)}
.lvsel{display:flex;gap:8px;flex-wrap:wrap}
.lvsel label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--soft);background:var(--sand);border-radius:12px;padding:4px 4px 4px 10px}
.lvsel select{font:inherit;font-size:15px;font-weight:800;border:0;border-radius:9px;padding:6px 8px;background:var(--card);color:var(--ink);min-height:40px}
.btn.sm{padding:8px 12px;font-size:14px;min-height:40px}
.seg.users button{display:flex;align-items:center;gap:6px}
input,textarea,select{-webkit-user-select:text;user-select:text}
#smp{cursor:zoom-in}

/* ===== ひとこと・まちがい・せいかい・ダイアログ ===== */
#toast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.9);background:#fff;border-radius:20px;
  padding:14px 22px;font-size:20px;font-weight:800;box-shadow:0 8px 24px rgba(60,40,0,.18);opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;white-space:nowrap;z-index:30}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#sheet{position:fixed;left:calc(env(safe-area-inset-left) + 12px);right:calc(env(safe-area-inset-right) + 12px);
  bottom:calc(env(safe-area-inset-bottom) + 10px);min-height:80px;background:#fff;border-radius:22px;padding:12px 14px;
  box-shadow:0 -4px 24px rgba(60,40,0,.14);display:none;align-items:center;gap:12px;z-index:5;border:3px solid #F8D3D4}
#sheet.show{display:flex}
.sheet-text{flex:1;min-width:0}
.sheet-text strong{font-size:24px;color:var(--bad);display:block;line-height:1.2}
.legend{display:flex;gap:16px;font-size:14px;font-weight:800;color:var(--soft);margin-top:4px;flex-wrap:wrap}
.legend i{display:inline-block;width:30px;height:0;border-top:5px dashed var(--bad);vertical-align:middle;margin-right:5px}
.legend i.m{border-top:5px dotted var(--miss)}
.sbtn{border-radius:16px;font-weight:900;font-size:18px;padding:12px 18px;min-height:56px;white-space:nowrap}
.sbtn.fix{background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent-d)}
.sbtn.skip{background:#F2E7D3}
.overlay{position:fixed;inset:0;background:rgba(255,246,230,.92);display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
.overlay.show{display:flex}
.ok-card{text-align:center}
.stamp-wrap{width:200px;height:200px;margin:0 auto;border-radius:50%;background:#fff;border:6px solid #FFC9A0;
  display:grid;place-items:center;box-shadow:0 8px 0 #F3DCC2}
.stamp{font-size:120px;line-height:1;display:inline-block;animation:stamp .7s cubic-bezier(.2,1.6,.4,1) both}
.ok-text{font-size:40px;font-weight:900;color:var(--good);margin:18px 0 6px;letter-spacing:.06em}
.ok-sub{font-size:20px;font-weight:800;color:var(--soft);min-height:28px;margin-bottom:20px}
.big{border-radius:999px;background:var(--good);color:#fff;font-weight:900;font-size:26px;padding:16px 56px;
  box-shadow:0 5px 0 var(--good-d);min-height:66px}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--good-d)}
.page-done{display:grid;grid-template-columns:repeat(5,44px);gap:6px;justify-content:center;margin:14px 0 4px}
.page-done span{font-size:34px;line-height:44px}
.dlg-card{background:#fff;border-radius:24px;padding:22px;max-width:560px;width:100%;box-shadow:0 12px 40px rgba(60,40,0,.2);
  display:flex;flex-direction:column;gap:14px}
.dlg-card h3{margin:0;font-size:20px}
.dlg-card p{margin:0;font-size:15px;line-height:1.6}
.dlg-card textarea{width:100%;height:160px;border-radius:12px;border:2px solid var(--line);padding:10px;font:13px/1.4 ui-monospace,Menlo,monospace;
  -webkit-user-select:text;user-select:text;touch-action:auto}
@keyframes stamp{0%{transform:scale(2.6) rotate(-25deg);opacity:0}55%{opacity:1}100%{transform:scale(1) rotate(-6deg);opacity:1}}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.stamp,.slot.pop{animation:none}}
@media (max-width:520px){
  .brand h1{font-size:30px}.mode .mk{font-size:18px}.main-card{padding:14px}.mc-k{font-size:22px}.mc-go{font-size:20px}
  .ptitle b{font-size:18px}.tb{min-height:64px;font-size:12px}.tb .ic{font-size:24px}#done{font-size:18px}
  .sheet-text strong{font-size:20px}.sbtn{font-size:15px;padding:10px 12px}.kpi b{font-size:22px}
}
</style>
</head>
<body>
<div id="app">

  <!-- ホーム -->
  <section class="screen" id="home">
    <div class="home-wrap">
      <div class="brand">
        <svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" fill="#FFF6E6"/><rect x="56" y="56" width="400" height="400" rx="72" fill="#fff" stroke="#F6C9A3" stroke-width="14"/><g stroke="#FF8A3D" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M140 256 L256 140 L372 256 L372 372 L140 372 Z"/><path d="M140 256 L372 256"/></g><g fill="#55648A"><circle cx="140" cy="140" r="24"/><circle cx="256" cy="140" r="24"/><circle cx="372" cy="140" r="24"/><circle cx="140" cy="256" r="24"/><circle cx="256" cy="256" r="24"/><circle cx="372" cy="256" r="24"/><circle cx="140" cy="372" r="24"/><circle cx="256" cy="372" r="24"/><circle cx="372" cy="372" r="24"/></g></svg>
        <h1>点つなぎ</h1>
      </div>
      <button class="who" id="whoBtn" aria-label="ユーザーをかえる"></button>
      <div class="modes" id="modes"></div>
      <button class="main-card" id="goMain">
        <div class="mc-top"><span class="mc-k">れんしゅう</span><span class="mc-lv" id="homeLv">レベル 1</span></div>
        <div class="stamps" id="homeStamps"></div>
        <div class="mc-go">はじめる ▶</div>
      </button>
      <div class="row2">
        <button class="sub-card" id="goReview"><span class="ic">📖</span>おさらい<small>クリアした レベル</small></button>
        <button class="sub-card" id="goDrill"><span class="ic">💪</span>とっくん<small>まちがえた もんだい</small><span class="badge" id="drillBadge"></span></button>
      </div>
      <div class="parent"><span>おうちのかたへ</span><button class="pbtn" id="goRecords">📊 きろく</button><button class="pbtn" id="goSettings">⚙️ せってい</button></div>
    </div>
  </section>

  <!-- だれが あそぶ？ -->
  <section class="screen" id="who">
    <div class="who-wrap">
      <h2>だれが あそぶ？</h2>
      <div class="who-grid" id="whoGrid"></div>
    </div>
  </section>

  <!-- 練習 -->
  <section class="screen" id="play">
    <div class="phead">
      <button class="icon-btn" id="toHome" aria-label="ホームにもどる">🏠</button>
      <div class="ptitle"><b id="pTitle">レベル 1</b><span class="chip" id="pMode">ふつう</span></div>
      <button class="icon-btn" id="sound" aria-label="おと">🔊</button>
    </div>
    <div id="prog"></div>
    <div id="stage">
      <div class="board"><div class="tagrow"><span class="tag">みほん</span><span class="tag howto" id="howto"></span><span class="tag" id="zoomTag">🔍 タップで おおきく</span></div><div class="card" id="smp"><svg id="svgS" viewBox="0 0 100 100"></svg></div></div>
      <div class="board"><div class="tagrow"><span class="tag" id="ansTag">ここに かこう</span></div><div class="card" id="ans"><svg id="svgA" viewBox="0 0 100 100"></svg></div></div>
    </div>
    <div id="toolbar">

      <button class="tb" id="clear"><span class="ic">🗑️</span>ぜんぶけす</button>
      <button class="tb" id="done"><span class="ic">⭐</span>できた！</button>
    </div>
  </section>

  <!-- おさらい -->
  <section class="screen" id="review">
    <div class="page-head"><button class="icon-btn back" aria-label="もどる">🏠</button><h2 id="reviewTitle">おさらい</h2></div>
    <div class="scroll"><div class="inner" id="reviewBody"></div></div>
  </section>

  <!-- きろく -->
  <section class="screen" id="records">
    <div class="page-head"><button class="icon-btn back" aria-label="もどる">🏠</button><h2>きろく</h2></div>
    <div class="scroll"><div class="inner" id="recordsBody"></div></div>
  </section>

  <!-- せってい -->
  <section class="screen" id="settings">
    <div class="page-head"><button class="icon-btn back" aria-label="もどる">🏠</button><h2>せってい</h2></div>
    <div class="scroll"><div class="inner" id="settingsBody"></div></div>
  </section>

  <div class="sheet-text"><strong>おしい！</strong><div class="legend" id="legend"></div></div>
  <button class="sbtn fix" id="fix">なおす</button>

  <div class="ok-card">
    <div class="stamp-wrap"><span class="stamp" id="okStamp">🐶</span></div>
    <div class="ok-text" id="okText">できたね！</div>

<input type="file" accept="image/*" id="photoIn" hidden>
<div class="overlay" id="dlg"><div class="dlg-card" id="dlgCard"></div></div>

<script>
{
  'use strict';

  // ================= 定数 =================
  const MAX_LV = 50, PER_PAGE = 20, PAD = 14, STORE = 'tentsunagi-v1';
  const ANIMALS = ['🐶','🐱','🐰','🐻','🐼','🦊','🐨','🐯','🐸','🐵','🐷','🐮','🐹','🐧','🐤','🦁','🐭','🐳','🦒','🐘'];
  const MODES = {
    normal: { label: 'ふつう', sub: '普通',     ar: '→', howto: '',               say: '' },
    flip:   { label: 'さかさ', sub: '上下逆転', ar: '↕', howto: '↕ さかさに かこう', say: 'うえと したを さかさまに して かこう' },
    mirror: { label: 'かがみ', sub: '鏡絵',     ar: '↔', howto: '↔ かがみに かこう', say: 'かがみに うつしたように かこう' },
  };
  const MODE_KEYS = ['normal', 'flip', 'mirror'];
  const $ = id => document.getElementById(id);
  const svgS = $('svgS'), svgA = $('svgA');

  // ================= 保存データ =================
  // db = { users:[ユーザーごとの進み具合], cur:いまのユーザーID, muted, layout, bigSample }
  // st = いまのユーザー（レベル・スタンプ・とっくん・記録）
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const freshProgress = () => ({
    mode: 'normal',
    modes: { normal: { lv: 1, c: 0 }, flip: { lv: 1, c: 0 }, mirror: { lv: 1, c: 0 } },
    drill: [], days: {},
    mstat: { normal: { t: 0, c: 0 }, flip: { t: 0, c: 0 }, mirror: { t: 0, c: 0 } },
  });
  const freshUser = name => Object.assign({ id: uid(), name, photo: '' }, freshProgress());
  function sanitizeUser(s, name) {
    const d = freshUser(name);
    if (!s || typeof s !== 'object') return d;
    if (typeof s.id === 'string' && /^[\w-]{1,40}$/.test(s.id)) d.id = s.id;
    if (typeof s.name === 'string' && s.name.trim()) d.name = s.name.trim().slice(0, 12);
    if (typeof s.photo === 'string' && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(s.photo) && s.photo.length < 300000) d.photo = s.photo;
    if (MODE_KEYS.includes(s.mode)) d.mode = s.mode;
    for (const m of MODE_KEYS) {
      const v = s.modes && s.modes[m];
      if (v) d.modes[m] = { lv: Math.min(MAX_LV, Math.max(1, v.lv | 0)), c: Math.min(PER_PAGE - 1, Math.max(0, v.c | 0)) };
      const t = s.mstat && s.mstat[m];
      if (t) d.mstat[m] = { t: Math.max(0, t.t | 0), c: Math.max(0, t.c | 0) };
    }
    if (Array.isArray(s.drill)) d.drill = s.drill.filter(x => x && Array.isArray(x.segs) && MODE_KEYS.includes(x.mode)).slice(-50);
    if (s.days && typeof s.days === 'object' && !Array.isArray(s.days)) d.days = s.days;
    return d;
  }
  function sanitizeDB(o) {
    const d = { ver: 2, users: [], cur: '', muted: false, layout: 'auto', bigSample: false };
    if (o && typeof o === 'object') {
      if (Array.isArray(o.users)) d.users = o.users.slice(0, 12).map((u, i) => sanitizeUser(u, 'ユーザー' + (i + 1)));
      else if (o.modes) d.users = [sanitizeUser(o, 'ユーザー1')];           // 1人用だったころのデータを引き継ぐ
      if (typeof o.cur === 'string') d.cur = o.cur;
      d.muted = !!o.muted;
      if (['auto', 'tb', 'lr'].includes(o.layout)) d.layout = o.layout;
      d.bigSample = !!o.bigSample;
    }
    if (!d.users.length) d.users = [freshUser('ユーザー1')];
    const ids = new Set();
    d.users.forEach(u => { if (ids.has(u.id)) u.id = uid(); ids.add(u.id); });
    if (!d.users.some(u => u.id === d.cur)) d.cur = d.users[0].id;
    return d;
  }
  let db = sanitizeDB(null);
  try { db = sanitizeDB(JSON.parse(localStorage.getItem(STORE))); } catch (e) {}
  let st = db.users.find(u => u.id === db.cur);
  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(db)); }
    catch (e) { toast('ほぞんできませんでした'); }
  }
  function setUser(id) {
    const u = db.users.find(x => x.id === id); if (!u) return;
    db.cur = u.id; st = u; recent = []; save();
  }
  const esc = v => String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const AV_COLORS = ['#FF8A3D', '#7B61FF', '#14A3B8', '#2FA36B', '#E5484D', '#D45C9E'];
  function avatar(u, cls = '') {
    if (u.photo) return `<span class="av ${cls}"><img src="${esc(u.photo)}" alt=""></span>`;
    const i = Math.max(0, db.users.indexOf(u));
    return `<span class="av ${cls}" style="background:${AV_COLORS[i % AV_COLORS.length]}">${esc(u.name.slice(0, 1))}</span>`;
  }

  // ================= 線のデータ =================
  function key(a, b) {
    if (a[0] > b[0] || (a[0] === b[0] && a[1] > b[1])) [a, b] = [b, a];
    return a[0] + ',' + a[1] + '-' + b[0] + ',' + b[1];
  }
  const parse = k => k.split('-').map(p => p.split(',').map(Number));
  const gcd = (a, b) => (b ? gcd(b, a % b) : a);
  function units(a, b) {               // 途中で通る点ごとに区切る
    const dx = b[0] - a[0], dy = b[1] - a[1], g = gcd(Math.abs(dx), Math.abs(dy));
    if (!g) return [];
    const sx = dx / g, sy = dy / g, out = [];
    for (let i = 0; i < g; i++) out.push(key([a[0] + sx * i, a[1] + sy * i], [a[0] + sx * (i + 1), a[1] + sy * (i + 1)]));
    return out;
  }
  const isDiag = k => { const [a, b] = parse(k); return a[0] !== b[0] && a[1] !== b[1]; };
  const isKnight = k => { const [a, b] = parse(k); const dx = Math.abs(a[0] - b[0]), dy = Math.abs(a[1] - b[1]); return dx && dy && dx !== dy; };
  const setEq = (a, b) => a.size === b.size && [...a].every(k => b.has(k));
  const rand = n => Math.floor(Math.random() * n);

  function tf(p, mode, n) { return mode === 'flip' ? [p[0], n - 1 - p[1]] : mode === 'mirror' ? [n - 1 - p[0], p[1]] : p; }
  function transform(segs, mode, n) {
    const out = new Set();
    for (const k of segs) { const [a, b] = parse(k); out.add(key(tf(a, mode, n), tf(b, mode, n))); }
    return out;
  }
  function canon(segs) {
    const ps = [...segs].map(parse);
    let mx = 99, my = 99;
    ps.forEach(([a, b]) => { mx = Math.min(mx, a[0], b[0]); my = Math.min(my, a[1], b[1]); });
    return ps.map(([a, b]) => key([a[0] - mx, a[1] - my], [b[0] - mx, b[1] - my])).sort().join('|');
  }

  // ================= レベル設計 =================
  // 1〜5: 3×3（Lv4から斜め） / 6〜15: 5×5 斜め45度 / 16〜25: 5×5 それ以外の斜め / 26〜40: 7×7 / 41〜50: 7×7 立体図形
  function cfg(lv) {
    if (lv <= 5) return [null,
      { n: 3, min: 2, max: 3, dirs: 'hv' },
      { n: 3, min: 3, max: 4, dirs: 'hv' },
      { n: 3, min: 3, max: 5, dirs: 'hv' },
      { n: 3, min: 3, max: 4, dirs: 'd45', need: 'diag' },
      { n: 3, min: 4, max: 5, dirs: 'd45', need: 'diag' }][lv];
    if (lv <= 15) { const min = 4 + Math.floor((lv - 6) * 4 / 9); return { n: 5, min, max: Math.min(10, min + 2), dirs: 'd45' }; }
    if (lv <= 25) { const min = 8 + Math.floor((lv - 16) * 4 / 9); return { n: 5, min, max: Math.min(14, min + 2), dirs: 'all', need: 'knight' }; }
    if (lv <= 40) { const min = 10 + Math.floor((lv - 26) * 8 / 14); return { n: 7, min, max: Math.min(20, min + 2), dirs: 'all' }; }
    return { n: 7, solid: true, lv };
  }
  const HV = [[1,0],[-1,0],[0,1],[0,-1]], DG = [[1,1],[-1,-1],[1,-1],[-1,1]];
  const KN = [[2,1],[-2,-1],[2,-1],[-2,1],[1,2],[-1,-2],[1,-2],[-1,2]];
  const dirsFor = t => (t === 'hv' ? HV : t === 'd45' ? HV.concat(DG) : HV.concat(DG, KN));

  function walk(c) {                    // つながった一筆書き風の図形（ときどき枝分かれ）
    const n = c.n, ds = dirsFor(c.dirs), len = c.min + rand(c.max - c.min + 1);
    const segs = new Set();
    let cur = [rand(n), rand(n)], prev = null, stuck = 0;
    const pts = [cur];
    while (segs.size < len && stuck < 150) {
      if (segs.size && Math.random() < 0.2) { cur = pts[rand(pts.length)]; prev = null; }
      const d = prev && Math.random() < 0.4 ? prev : ds[rand(ds.length)];
      const nx = [cur[0] + d[0], cur[1] + d[1]];
      if (nx[0] < 0 || nx[1] < 0 || nx[0] >= n || nx[1] >= n) { stuck++; prev = null; continue; }
      const k = key(cur, nx);
      if (segs.has(k)) { stuck++; prev = null; continue; }
      segs.add(k); pts.push(nx); cur = nx; prev = d;
    }
    return segs.size >= len ? segs : null;
  }

  function solid(lv) {                  // 立体図形（直方体・階段）を斜め上から見た形
    let lines;
    if (lv >= 48 && Math.random() < 0.5) {
      const u = 1 + rand(2);
      const A = [0, 2*u+1], B = [2*u, 2*u+1], C = [2*u, 1], D = [u, 1], E = [u, u+1], F = [0, u+1];
      const D2 = [u+1, 0], C2 = [2*u+1, 0], B2 = [2*u+1, 2*u], F2 = [1, u];
      lines = [[A,B],[B,C],[C,D],[D,E],[E,F],[F,A],[D,D2],[C,C2],[D2,C2],[C2,B2],[B,B2],[F,F2]];
      if (u > 1) lines.push([F2, [u, u]]);
    } else {
      const big = lv >= 45;
      const d = big ? 1 + rand(2) : 1;
      const w = Math.min(6 - d, 1 + rand(big ? 3 : 2)), h = Math.min(6 - d, 1 + rand(big ? 3 : 2));
      lines = [[[0,d],[w,d]],[[w,d],[w,d+h]],[[w,d+h],[0,d+h]],[[0,d+h],[0,d]],
               [[d,0],[w+d,0]],[[w+d,0],[w+d,h]],
               [[0,d],[d,0]],[[w,d],[w+d,0]],[[w,d+h],[w+d,h]]];
    }
    let mx = 0, my = 0;
    lines.forEach(l => l.forEach(p => { mx = Math.max(mx, p[0]); my = Math.max(my, p[1]); }));
    const fx = Math.random() < 0.5, ox = rand(7 - mx), oy = rand(7 - my);
    const t = p => [(fx ? mx - p[0] : p[0]) + ox, p[1] + oy];
    const segs = new Set();
    lines.forEach(([a, b]) => units(t(a), t(b)).forEach(k => segs.add(k)));
    return segs;
  }

  let recent = [];
  function makeProblem(lv, mode) {
    const c = cfg(lv);
    let last = null;
    for (let i = 0; i < 400; i++) {
      const segs = c.solid ? solid(lv) : walk(c);
      if (!segs) continue;
      last = segs;
      if (c.need === 'diag' && ![...segs].some(isDiag)) continue;
      if (c.need === 'knight' && ![...segs].some(isKnight)) continue;
      const ans = transform(segs, mode, c.n);
      if (mode !== 'normal' && setEq(ans, segs)) continue;          // 反転しても同じ形は練習にならない
      const sig = mode + ':' + canon(segs);
      if (recent.slice(c.solid ? -6 : -20).includes(sig) && i < 300) continue;   // 直前の問題と同じ形は出さない（立体は形の種類が少ないので直前6問）
      recent.push(sig); if (recent.length > 20) recent.shift();
      return { n: c.n, lv, mode, dirs: c.dirs || 'd45', sample: segs, answer: ans };
    }
    const segs = last || new Set([key([0, 0], [1, 0])]);
    return { n: c.n, lv, mode, dirs: c.dirs || 'd45', sample: segs, answer: transform(segs, mode, c.n) };
  }

  // ================= 記録 =================
  const pad2 = v => String(v).padStart(2, '0');
  const dayKey = (d = new Date()) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  function addDay(field, v) {
    const k = dayKey();
    const d = st.days[k] || (st.days[k] = { t: 0, c: 0, ms: 0 });
    d[field] = (d[field] || 0) + v;
    const keys = Object.keys(st.days).sort();
    while (keys.length > 400) delete st.days[keys.shift()];
  }
  let mark = 0;
  const startTimer = () => { mark = Date.now(); };
  function stopTimer() {
    if (!mark) return;
    addDay('ms', Math.min(Date.now() - mark, 180000));   // 1問あたり最大3分まで数える
    mark = 0; save();
  }

  // ================= 音と声 =================
  let ac = null;
  function unlockAudio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (ac && ac.state === 'suspended') ac.resume();
  }
  function tone(f, t0, d, type, g) {
    const o = ac.createOscillator(), v = ac.createGain();
    o.type = type; o.frequency.value = f;
    v.gain.setValueAtTime(0.0001, t0);
    v.gain.exponentialRampToValueAtTime(g, t0 + 0.015);
    v.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(v); v.connect(ac.destination);
    o.start(t0); o.stop(t0 + d + 0.05);
  }
  const tick = () => { if (!db.muted && ac) tone(880, ac.currentTime, 0.08, 'triangle', 0.07); };
  function clap(big) {
    if (db.muted || !ac) return;
    const t = ac.currentTime;
    const notes = big ? [523, 659, 784, 1047, 1319, 1568] : [523, 659, 784, 1047];
    notes.forEach((f, i) => tone(f, t + i * 0.09, 0.4, 'triangle', 0.12));
    const len = Math.floor(ac.sampleRate * 0.08);
    const buf = ac.createBuffer(1, len, ac.sampleRate), dd = buf.getChannelData(0);
    for (let i = 0; i < len; i++) dd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const count = big ? 16 : 9, start = notes.length * 0.09 + 0.15;
    for (let i = 0; i < count; i++) {
      const src = ac.createBufferSource(); src.buffer = buf;
      const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1100 + Math.random() * 900;
      const g = ac.createGain(); g.gain.value = 0.55;
      src.connect(f); f.connect(g); g.connect(ac.destination);
      src.start(t + start + i * 0.11 + Math.random() * 0.04);
    }
  }
  function boo() { if (db.muted || !ac) return; const t = ac.currentTime; tone(523, t, 0.22, 'sine', 0.1); tone(392, t + 0.2, 0.35, 'sine', 0.1); }
  let jaVoice = null;
  function pickVoice() { try { jaVoice = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('ja')) || null; } catch (e) {} }
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function say(text) {
    if (db.muted || !text || !('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ja-JP'; u.rate = 0.95; u.pitch = 1.15;
      if (jaVoice) u.voice = jaVoice;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  let toastTimer = 0;
  function toast(text) {
    const el = $('toast'); el.textContent = text; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
  }
  const hint = () => { toast('てんから てんまで かこうね'); say('てんから てんまで かこうね'); };

  // ================= 画面の切り替え =================
  let screen = 'home';
  function show(name) {
    if (screen === 'play' && name !== 'play') stopTimer();
    screen = name;
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === name));
    if (name === 'home') renderHome();
    if (name === 'who') renderWho();
    if (name === 'play') requestAnimationFrame(layout);
  }
  document.querySelectorAll('.back').forEach(b => b.addEventListener('click', () => show('home')));

  // ================= ホーム =================
  // ふつうのLv5クリアで解放。おうちのかたが設定でレベルを上げたモードも選べる
  const unlocked = (m, u = st) => m === 'normal' || u.modes.normal.lv > 5 || u.modes[m].lv > 1;
  function stampSlots(count, popIdx) {
    let s = '';
    for (let i = 0; i < PER_PAGE; i++) s += `<div class="slot${i < count ? ' got' : ''}${i === popIdx ? ' pop' : ''}">${i < count ? ANIMALS[i] : ''}</div>`;
    return s;
  }
  function renderHome() {
    if (!unlocked(st.mode)) st.mode = 'normal';
    $('whoBtn').innerHTML = avatar(st) + `<span><b>${esc(st.name)}</b>${db.users.length > 1 ? '<br><small>タップで かえる</small>' : ''}</span>`;
    $('modes').innerHTML = MODE_KEYS.map(m => {
      const M = MODES[m], lock = !unlocked(m);
      return `<button class="mode${st.mode === m ? ' on' : ''}${lock ? ' locked' : ''}" data-m="${m}">
        ${lock ? '<span class="lock">🔒</span>' : ''}<span class="ar">${M.ar}</span><span class="mk">${M.label}</span><span class="ms">${M.sub}</span></button>`;
    }).join('');
    const p = st.modes[st.mode];
    $('homeLv').textContent = `レベル ${p.lv}` + (p.lv >= MAX_LV ? '（さいご）' : '');
    $('homeStamps').innerHTML = stampSlots(p.c);
    $('drillBadge').textContent = st.drill.length ? st.drill.length : '';
  }
  $('modes').addEventListener('click', e => {
    const b = e.target.closest('.mode'); if (!b) return;
    unlockAudio();
    const m = b.dataset.m;
    if (!unlocked(m)) { toast('ふつうの レベル5を クリアすると あそべるよ'); say('ふつうの レベル5を クリアすると あそべるよ'); return; }
    st.mode = m; save(); renderHome();
    say(MODES[m].label);
  });

  // ================= だれが あそぶ？ =================
  function renderWho() {
    $('whoGrid').innerHTML = db.users.map(u =>
      `<button class="who-tile${u.id === db.cur ? ' on' : ''}" data-id="${esc(u.id)}">${avatar(u, 'xl')}${esc(u.name)}</button>`).join('');
  }
  $('whoGrid').addEventListener('click', e => {
    const b = e.target.closest('.who-tile'); if (!b) return;
    unlockAudio();
    setUser(b.dataset.id);
    show('home');
  });
  $('whoBtn').addEventListener('click', () => { if (db.users.length > 1) show('who'); else { renderSettings(); show('settings'); } });

  // ================= 練習 =================
  // session.src: 'main'（れんしゅう） / 'review'（おさらい） / 'drill'（とっくん）
  let session = null, prob = null;
  let user = new Set(), hist = [], mode = 'draw', judged = null, pending = null, stroke = null, erasing = null, preview = null, busy = false;

  const N = () => prob.n;
  const step = () => (100 - 2 * PAD) / (N() - 1);
  const pos = i => PAD + i * step();
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const dotR = () => clamp(step() * 0.1, 1.4, 3.6);
  const lw = () => clamp(step() * 0.095, 1.7, 3.4);
  const snapR = () => step() * (prob.dirs === 'all' ? 0.3 : 0.42);   // 斜め(2:1)のある問題は吸い付きを弱く
  const same = (a, b) => !!a && !!b && a[0] === b[0] && a[1] === b[1];

  function startSession(src, opt = {}) {
    unlockAudio();
    session = { src, lv: opt.lv, mode: opt.mode || st.mode, introDone: false };
    show('play');
    nextProblem();
  }
  function nextProblem() {
    if (session.src === 'drill') {
      if (!st.drill.length) { show('home'); return; }
      const it = st.drill[0];
      const sample = new Set(it.segs);
      prob = { n: it.n, lv: it.lv, mode: it.mode, dirs: it.dirs || 'd45', sample, answer: transform(sample, it.mode, it.n), drillId: it.id };
    } else {
      const lv = session.src === 'review' ? session.lv : st.modes[session.mode].lv;
      prob = makeProblem(lv, session.mode);
    }
    user = new Set(); hist = []; judged = null; pending = null; stroke = null; erasing = null; preview = null; busy = false;
    setMode('draw'); hideSheet();
    renderPlayHead(); renderSample(); renderAns(); renderZoomTag(); layout();
    startTimer();
    if (!session.introDone) { session.introDone = true; if (prob.mode !== 'normal') say(MODES[prob.mode].say); }
  }
  function renderPlayHead(popIdx) {
    const M = MODES[prob.mode];
    $('pMode').textContent = M.label; $('pMode').dataset.m = prob.mode;
    $('howto').textContent = M.howto; $('howto').dataset.m = prob.mode; $('howto').style.display = M.howto ? '' : 'none';
    $('smp').dataset.m = prob.mode;
    if (session.src === 'main') {
      $('pTitle').textContent = `レベル ${prob.lv}`;
      $('prog').innerHTML = stampSlots(st.modes[prob.mode].c, popIdx);
    } else if (session.src === 'review') {
      $('pTitle').textContent = `おさらい レベル ${prob.lv}`;
      $('prog').innerHTML = '';
    } else {
      $('pTitle').textContent = 'とっくん';
      $('prog').innerHTML = `<div class="drill-left">のこり ${st.drill.length} もん</div>`;
    }
  }

  function linesSVG(keys, attrs) {
    return keys.map(k => { const [a, b] = parse(k);
      return `<line x1="${pos(a[0])}" y1="${pos(a[1])}" x2="${pos(b[0])}" y2="${pos(b[1])}" ${attrs}/>`; }).join('');
  }
  function dotsSVG(r, hl) {
    let s = '';
    for (let y = 0; y < N(); y++) for (let x = 0; x < N(); x++) {
      const on = hl && hl[0] === x && hl[1] === y;
      s += `<circle cx="${pos(x)}" cy="${pos(y)}" r="${on ? r * 1.9 : r}" fill="${on ? 'var(--accent)' : 'var(--dot)'}"/>`;
    }
    return s;
  }
  const inkLine = () => `stroke="var(--ink)" stroke-width="${lw()}" stroke-linecap="round"`;
  function renderSample() { svgS.innerHTML = linesSVG([...prob.sample], inkLine()) + dotsSVG(dotR() * 0.9); }
  function renderAns() {
    let s = '';
    if (judged) {
      const ok = [...user].filter(k => prob.answer.has(k));
      s += linesSVG(judged.miss, `stroke="var(--miss)" stroke-width="${lw() * 1.1}" stroke-linecap="round" stroke-dasharray="0.1 ${lw() * 2.2}"`);
      s += linesSVG(ok, inkLine());
      s += linesSVG(judged.extra, `stroke="var(--bad)" stroke-width="${lw()}" stroke-dasharray="${lw() * 1.6} ${lw() * 1.1}"`);
    } else s += linesSVG([...user], inkLine());
    if (preview) {
      const [a, p] = preview;
      s += `<line x1="${pos(a[0])}" y1="${pos(a[1])}" x2="${p[0]}" y2="${p[1]}" stroke="var(--accent)" stroke-width="${lw()}" stroke-linecap="round" opacity=".55"/>`;
    }
    s += dotsSVG(dotR(), pending || (stroke && stroke.from));
    svgA.innerHTML = s;
  }

  function layout() {
    if (screen !== 'play') return;
    const stage = $('stage'), r = stage.getBoundingClientRect();
    const W = r.width, H = r.height, lab = 28, gap = 10;
    if (W < 10 || H < 10) return;
    const land = db.layout === 'lr' ? true : db.layout === 'tb' ? false : W > H * 1.2;
    stage.classList.toggle('land', land);
    let a, s;
    if (!land) {
      const h = H - 2 * lab - gap;
      if (db.bigSample) a = s = Math.min(W, h / 2);                       // 見本を解答と同じ大きさに
      else { a = Math.min(W, h * 0.6); s = Math.min(h - a, a * 0.72, W); }
    } else {
      const w = W - 24;
      if (db.bigSample) a = s = Math.min(H - lab, w / 2);
      else { a = Math.min(H - lab, w * 0.58); s = Math.min(w - a, a * 0.72, H - lab); }
    }
    a = Math.max(120, Math.floor(a)); s = Math.max(80, Math.floor(s));
    Object.assign($('ans').style, { width: a + 'px', height: a + 'px' });
    Object.assign($('smp').style, { width: s + 'px', height: s + 'px' });
  }

  function renderZoomTag() { $('zoomTag').textContent = db.bigSample ? '🔍 タップで ちいさく' : '🔍 タップで おおきく'; }
  $('smp').addEventListener('click', () => {
    if (busy) return;
    db.bigSample = !db.bigSample; save(); renderZoomTag(); layout();
  });

  function setMode(m) {
    mode = m;
    const on = m === 'erase';
    $('eraser').classList.toggle('on', on);
    $('ans').classList.toggle('erasing', on);
    const tag = $('ansTag');
    tag.classList.toggle('erase', on);
    tag.textContent = on ? 'けしゴム：けしたい せんを なぞってね' : 'ここに かこう';
  }
  function clearMarks() { if (judged) { judged = null; hideSheet(); } }
  function hideSheet() { $('sheet').classList.remove('show'); }

  // ---------- 判定 ----------
  function judge() {
    if (busy) return;
    unlockAudio();
    pending = null; setMode('draw');
    if (user.size === 0) { toast('せんを かいてね'); say('せんを かいてね'); renderAns(); return; }
    stopTimer();
    const extra = [...user].filter(k => !prob.answer.has(k));
    const miss = [...prob.answer].filter(k => !user.has(k));
    const ok = !extra.length && !miss.length;
    addDay('t', 1); st.mstat[prob.mode].t++;
    if (ok) { addDay('c', 1); st.mstat[prob.mode].c++; }
    save();
    if (ok) correct(); else wrong(extra, miss);
  }

  function addDrill() {
    const sig = prob.mode + ':' + canon(prob.sample);
    if (st.drill.some(d => d.sig === sig)) return;
    st.drill.push({ id: Date.now().toString(36) + rand(1e6).toString(36), sig, mode: prob.mode, lv: prob.lv, n: prob.n, dirs: prob.dirs, segs: [...prob.sample] });
    if (st.drill.length > 50) st.drill.shift();
  }

  let afterOk = null;
  function showOk({ stamp, text, sub = '', page = false, big = false }) {
    const el = $('okStamp');
    el.textContent = stamp;
    el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
    $('okText').textContent = text;
    $('okSub').textContent = sub;
    $('okPage').innerHTML = page ? `<div class="page-done">${ANIMALS.map(a => `<span>${a}</span>`).join('')}</div>` : '';
    $('ok').classList.add('show');
    clap(big);
  }

  function correct() {
    busy = true;
    if (session.src === 'main') {
      const p = st.modes[prob.mode];
      const c = p.c + 1;
      if (c >= PER_PAGE) {                     // レベルクリア
        const clearedLv = p.lv;
        const unlockNow = prob.mode === 'normal' && clearedLv === 5;
        p.c = 0;
        if (p.lv < MAX_LV) p.lv++;
        save();
        $('prog').innerHTML = stampSlots(PER_PAGE, PER_PAGE - 1);
        const sub = unlockNow ? '「さかさ」と「かがみ」で あそべるように なったよ'
                  : clearedLv >= MAX_LV ? 'ぜんぶの レベルを クリア！' : `つぎは レベル ${p.lv}`;
        showOk({ stamp: '🏆', text: `レベル${clearedLv} クリア！`, sub, page: true, big: true });
        say(unlockNow ? `レベル${clearedLv} クリア！ さかさと かがみで あそべるように なったよ` : `すごい！ レベル${clearedLv} クリア！`);
        afterOk = unlockNow ? () => show('home') : nextProblem;
      } else {
        p.c = c; save();
        renderPlayHead(c - 1);
        showOk({ stamp: ANIMALS[c - 1], text: 'できたね！', sub: `あと ${PER_PAGE - c} こで ページ かんせい` });
        say('できたね！');
        afterOk = nextProblem;
      }
    } else if (session.src === 'review') {
      showOk({ stamp: ANIMALS[rand(ANIMALS.length)], text: 'できたね！' });
      say('できたね！');
      afterOk = nextProblem;
    } else {
      st.drill = st.drill.filter(d => d.id !== prob.drillId); save();
      const left = st.drill.length;
      showOk({ stamp: '💪', text: 'できたね！', sub: left ? `とっくん のこり ${left} もん` : 'とっくん ぜんぶ クリア！', big: !left });
      say(left ? 'できたね！' : 'とっくん ぜんぶ クリア！ すごいね');
      afterOk = left ? nextProblem : () => show('home');
    }
  }
  function wrong(extra, miss) {
    if (session.src !== 'drill') addDrill();
    save();
    judged = { extra, miss };
    renderAns();
    const parts = [];
    if (extra.length) parts.push('<span><i></i>いらない せん</span>');
    if (miss.length) parts.push('<span><i class="m"></i>たりない せん</span>');
    $('legend').innerHTML = parts.join('');
    $('sheet').classList.add('show');
    boo();
    say('おしい！ もういちど みてみよう');
  }
  $('next').addEventListener('click', () => {
    $('ok').classList.remove('show');
    busy = false;
    const f = afterOk; afterOk = null;
    if (f) f();
  });
  $('fix').addEventListener('click', () => { hideSheet(); startTimer(); });
  $('skip').addEventListener('click', () => {
    if (session.src === 'drill' && st.drill.length > 1) { st.drill.push(st.drill.shift()); save(); }  // 次の問題を先に
    nextProblem();
  });

  // ---------- 指の操作 ----------
  function local(e) {
    const r = svgA.getBoundingClientRect();
    return [(e.clientX - r.left) / r.width * 100, (e.clientY - r.top) / r.height * 100];
  }
  function nearest(p) {
    let best = null, bd = 1e9;
    for (let y = 0; y < N(); y++) for (let x = 0; x < N(); x++) {
      const d = Math.hypot(pos(x) - p[0], pos(y) - p[1]);
      if (d < bd) { bd = d; best = [x, y]; }
    }
    return bd <= snapR() ? best : null;
  }
  function addLine(a, b, bucket) { for (const k of units(a, b)) if (!user.has(k)) { user.add(k); bucket.push(k); } }
  function distSeg(p, a, b) {
    const ax = pos(a[0]), ay = pos(a[1]), bx = pos(b[0]), by = pos(b[1]), dx = bx - ax, dy = by - ay;
    const t = clamp(((p[0] - ax) * dx + (p[1] - ay) * dy) / (dx * dx + dy * dy), 0, 1);
    return Math.hypot(p[0] - ax - t * dx, p[1] - ay - t * dy);
  }
  function eraseAt(p) {
    const th = Math.max(3, step() * 0.16);
    for (const k of [...user]) { const [a, b] = parse(k); if (distSeg(p, a, b) < th) { user.delete(k); erasing.keys.push(k); } }
  }

  svgA.addEventListener('pointerdown', e => {
    if (busy || stroke || erasing || !prob) return;
    e.preventDefault(); unlockAudio();
    try { svgA.setPointerCapture(e.pointerId); } catch (err) {}
    clearMarks();
    const p = local(e);
    if (mode === 'erase') { erasing = { id: e.pointerId, keys: [] }; eraseAt(p); renderAns(); return; }
    const d = nearest(p);
    if (!d) { pending = null; renderAns(); hint(); return; }
    if (pending) {                                   // 点を2回タップして線を引く
      if (!same(pending, d)) { const b = []; addLine(pending, d, b); if (b.length) { hist.push({ t: 'add', k: b }); tick(); } }
      pending = null; renderAns(); return;
    }
    stroke = { id: e.pointerId, from: d, start: d, down: p, moved: false, added: [] };
    preview = null; renderAns();
  });
  svgA.addEventListener('pointermove', e => {
    const p = local(e);
    if (erasing && e.pointerId === erasing.id) { eraseAt(p); renderAns(); return; }
    if (!stroke || e.pointerId !== stroke.id) return;
    if (Math.hypot(p[0] - stroke.down[0], p[1] - stroke.down[1]) > step() * 0.3) stroke.moved = true;
    const d = nearest(p);
    if (d && !same(d, stroke.from)) {                // 次の点に届いたら線を確定し、そこから続ける
      const before = stroke.added.length;
      addLine(stroke.from, d, stroke.added);
      if (stroke.added.length > before) tick();
      stroke.from = d;
    }
    preview = stroke.moved ? [stroke.from, p] : null;
    renderAns();
  });
  function endPointer(e) {
    if (erasing && e.pointerId === erasing.id) {
      if (erasing.keys.length) hist.push({ t: 'del', k: erasing.keys });
      erasing = null; renderAns(); return;
    }
    if (!stroke || e.pointerId !== stroke.id) return;
    if (stroke.added.length) hist.push({ t: 'add', k: stroke.added });
    else if (!stroke.moved) pending = stroke.start;
    else hint();
    stroke = null; preview = null; renderAns();
  }
  svgA.addEventListener('pointerup', endPointer);
  svgA.addEventListener('pointercancel', endPointer);

  $('eraser').addEventListener('click', () => { if (busy) return; pending = null; clearMarks(); setMode(mode === 'erase' ? 'draw' : 'erase'); renderAns(); });
  $('clear').addEventListener('click', () => {
    if (busy) return;
    clearMarks(); pending = null;
    if (user.size) { hist.push({ t: 'del', k: [...user] }); user.clear(); }
    renderAns();
  });
  $('done').addEventListener('click', judge);
  $('toHome').addEventListener('click', () => { hideSheet(); show('home'); });
  const renderSound = () => { $('sound').textContent = db.muted ? '🔇' : '🔊'; };
  $('sound').addEventListener('click', () => {
    db.muted = !db.muted; save(); renderSound();
    if (db.muted && 'speechSynthesis' in window) speechSynthesis.cancel();
  });

  // ================= ホームのボタン =================
  $('goMain').addEventListener('click', () => startSession('main'));
  $('goDrill').addEventListener('click', () => {
    unlockAudio();
    if (!st.drill.length) { toast('とっくんの もんだいは ないよ'); say('とっくんの もんだいは ないよ'); return; }
    startSession('drill');
  });
  $('goReview').addEventListener('click', () => { unlockAudio(); renderReview(); show('review'); });
  $('goRecords').addEventListener('click', () => { recUser = db.cur; renderRecords(); show('records'); });
  $('goSettings').addEventListener('click', () => { renderSettings(); show('settings'); });

  // ================= おさらい =================
  function renderReview() {
    const m = st.mode, top = st.modes[m].lv - 1;
    $('reviewTitle').textContent = `おさらい（${MODES[m].label}）`;
    if (top < 1) { $('reviewBody').innerHTML = '<div class="empty">まだ クリアした レベルが ないよ<br>れんしゅうで スタンプを 20こ あつめよう</div>'; return; }
    let s = '<div class="lvgrid">';
    for (let lv = 1; lv <= top; lv++) {
      const g = cfg(lv);
      s += `<button class="lvbtn" data-lv="${lv}"><span>${ANIMALS[(lv - 1) % ANIMALS.length]}</span>レベル${lv}<small>${g.n}×${g.n}${g.solid ? ' りったい' : ''}</small></button>`;
    }
    $('reviewBody').innerHTML = s + '</div>';
  }
  $('reviewBody').addEventListener('click', e => {
    const b = e.target.closest('.lvbtn'); if (!b) return;
    startSession('review', { lv: Number(b.dataset.lv) });
  });

  // ================= きろく（保護者向け） =================
  const fmtMin = ms => { const m = Math.round(ms / 60000); return m < 60 ? m + '分' : Math.floor(m / 60) + '時間' + (m % 60) + '分'; };
  const pct = (c, t) => (t ? Math.round(c / t * 100) + '%' : '—');
  let recUser = '';
  function renderRecords() {
    const u = db.users.find(x => x.id === recUser) || st;
    const today = new Date(), rows = [];
    let wT = 0, wC = 0, wMs = 0;
    for (let i = 13; i >= 0; i--) {
      const d = new Date(today); d.setDate(d.getDate() - i);
      const v = u.days[dayKey(d)] || { t: 0, c: 0, ms: 0 };
      rows.push({ lbl: (d.getMonth() + 1) + '/' + d.getDate(), t: v.t || 0, c: v.c || 0, ms: v.ms || 0 });
      if (i < 7) { wT += v.t || 0; wC += v.c || 0; wMs += v.ms || 0; }
    }
    const td = u.days[dayKey()] || { t: 0, c: 0, ms: 0 };
    const maxC = Math.max(1, ...rows.map(r => r.c));
    const bars = rows.reverse().map(r => `<div class="bar-row"><span class="lbl">${r.lbl}</span><div class="bar-track"><div class="bar-fill" style="width:${r.c / maxC * 100}%"></div></div><span class="num">${r.c}問 / ${fmtMin(r.ms)}</span></div>`).join('');
    const modeRows = MODE_KEYS.map(m => {
      const s = u.mstat[m], p = u.modes[m];
      return `<tr><td>${MODES[m].sub}</td><td class="r">${unlocked(m, u) ? 'Lv' + p.lv + '（' + p.c + '/20）' : '未解放'}</td><td class="r">${s.c} / ${s.t}</td><td class="r">${pct(s.c, s.t)}</td></tr>`;
    }).join('');
    const weak = MODE_KEYS.filter(m => u.mstat[m].t >= 10).sort((a, b) => u.mstat[a].c / u.mstat[a].t - u.mstat[b].c / u.mstat[b].t)[0];
    const drillBy = MODE_KEYS.map(m => `${MODES[m].sub} ${u.drill.filter(d => d.mode === m).length}問`).join('・');
    const picker = db.users.length > 1
      ? `<div class="seg users" id="recUsers">${db.users.map(x => `<button data-id="${esc(x.id)}" class="${x === u ? 'on' : ''}">${avatar(x, 'sm')}${esc(x.name)}</button>`).join('')}</div>`
      : '';
    $('recordsBody').innerHTML = `
      ${picker}
      <div class="kpis">
        <div class="kpi"><b>${td.c || 0}問</b><span>今日の正解（挑戦 ${td.t || 0}回）</span></div>
        <div class="kpi"><b>${wC}問</b><span>7日間の正解・正答率 ${pct(wC, wT)}</span></div>
        <div class="kpi"><b>${fmtMin(wMs)}</b><span>7日間の練習時間</span></div>
      </div>
      <div class="panel"><h3>日ごとの正解数と練習時間（14日間）</h3><div class="bars">${bars}</div></div>
      <div class="panel"><h3>モード別</h3>
        <table><thead><tr><th>モード</th><th class="r">いまのレベル</th><th class="r">正解 / 挑戦</th><th class="r">正答率</th></tr></thead><tbody>${modeRows}</tbody></table>
        <p>${weak ? `正答率がいちばん低いのは「${MODES[weak].sub}」です。` : '10回以上挑戦すると、苦手なモードを表示します。'}</p>
      </div>
      <div class="panel"><h3>とっくん（間違えた問題）</h3><p>残り ${u.drill.length}問（${drillBy}）。正解すると一覧から消えます。</p></div>
      <div class="panel"><h3>データの引っ越し</h3>
        <p>機種変更やブラウザの入れ替えの前に書き出しておくと、別の端末で読み込んで続きから使えます（全員分・写真も含みます）。</p>
        <div class="btns"><button class="btn" id="exp">書き出す</button><button class="btn" id="imp">読み込む</button></div>
      </div>`;
    const ru = $('recUsers');
    if (ru) ru.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { recUser = b.dataset.id; renderRecords(); } });
    $('exp').addEventListener('click', exportData);
    $('imp').addEventListener('click', importData);
  }

  // ================= せってい（保護者向け） =================
  let photoTarget = '';
  function renderSettings() {
    const seg = (name, cur, opts) => `<div class="seg" data-k="${name}">${opts.map(([v, l]) => `<button data-v="${v}" class="${cur === v ? 'on' : ''}">${l}</button>`).join('')}</div>`;
    const lvOpts = cur => Array.from({ length: MAX_LV }, (_, i) => `<option value="${i + 1}"${i + 1 === cur ? ' selected' : ''}>レベル${i + 1}</option>`).join('');
    const users = db.users.map(u => `
      <div class="ucard" data-id="${esc(u.id)}">
        <button class="photo-btn" data-act="photo" aria-label="写真を選ぶ">${avatar(u)}</button>
        <div class="ubody">
          <input class="uname" data-act="name" value="${esc(u.name)}" maxlength="12" placeholder="なまえ" enterkeyhint="done">
          <div class="lvsel">${MODE_KEYS.map(m => `<label>${MODES[m].sub}<select data-act="lv" data-m="${m}">${lvOpts(u.modes[m].lv)}</select></label>`).join('')}</div>
          <div class="btns">
            <button class="btn sm" data-act="photo">写真を選ぶ</button>
            ${u.photo ? '<button class="btn sm" data-act="unphoto">写真を外す</button>' : ''}
            <button class="btn sm" data-act="reset">進み具合をリセット</button>
            ${db.users.length > 1 ? '<button class="btn sm warn" data-act="del">削除</button>' : ''}
          </div>
        </div>
      </div>`).join('');
    $('settingsBody').innerHTML = `
      <div class="panel"><h3>ユーザー</h3>
        <p>丸い所をタップすると写真を選べます。レベルを変えると、そのモードはそのレベルのスタンプ0個から始まります。「上下逆転」「鏡絵」は、普通のレベル6以上か、ここでレベル2以上にすると選べるようになります。</p>
        ${users}
        <div class="btns" style="margin-top:6px"><button class="btn pri" id="addUser">＋ ユーザーを追加</button></div>
      </div>
      <div class="panel">
        <div class="set-row"><div class="l">音と声<small>効果音と読み上げ</small></div>${seg('muted', db.muted ? 'off' : 'on', [['on', 'オン'], ['off', 'オフ']])}</div>
        <div class="set-row"><div class="l">見本の大きさ<small>練習中に見本をタップしても切り替わります</small></div>${seg('bigSample', db.bigSample ? 'big' : 'small', [['small', '小さめ'], ['big', '解答と同じ']])}</div>
        <div class="set-row"><div class="l">見本と解答の並べ方<small>「自動」は画面の向きに合わせます</small></div>${seg('layout', db.layout, [['auto', '自動'], ['tb', '上下'], ['lr', '左右']])}</div>
      </div>
      <div class="panel"><h3>このアプリについて</h3>
        <p>点つなぎ v1.1 ／ 全50レベル（3×3・5×5・7×7・立体図形）、ふつう・さかさ（上下逆転）・かがみ（鏡絵）。記録と写真はこの端末の中だけに保存されます。</p>
      </div>`;
    document.querySelectorAll('#settingsBody .seg').forEach(g => g.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      const k = g.dataset.k, v = b.dataset.v;
      if (k === 'muted') { db.muted = v === 'off'; renderSound(); }
      else if (k === 'bigSample') db.bigSample = v === 'big';
      else db.layout = v;
      save(); renderSettings();
    }));
    $('addUser').addEventListener('click', () => {
      if (db.users.length >= 12) { toast('12人まで ついか できます'); return; }
      const u = freshUser('ユーザー' + (db.users.length + 1));
      db.users.push(u); save(); renderSettings();
      const inp = document.querySelector(`.ucard[data-id="${u.id}"] .uname`);
      if (inp) { inp.scrollIntoView({ block: 'center' }); inp.focus(); inp.select(); }
    });
  }
  const userOf = el => { const c = el.closest('.ucard'); return c && db.users.find(u => u.id === c.dataset.id); };
  $('settingsBody').addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'INPUT' || b.tagName === 'SELECT') return;
    const u = userOf(b); if (!u) return;
    const act = b.dataset.act;
    if (act === 'photo') { photoTarget = u.id; $('photoIn').value = ''; $('photoIn').click(); }
    else if (act === 'unphoto') { u.photo = ''; save(); renderSettings(); }
    else if (act === 'reset') dialog(`${esc(u.name)}さんの進み具合をリセットしますか？`, '<p>レベル・スタンプ・とっくん・記録が消えます。名前と写真は残ります。元に戻せません。</p>', [
      { label: 'やめる' },
      { label: 'リセットする', cls: 'warn', fn: () => { Object.assign(u, freshProgress()); recent = []; save(); renderSettings(); toast('リセットしました'); } },
    ]);
    else if (act === 'del') dialog(`${esc(u.name)}さんを削除しますか？`, '<p>このユーザーの進み具合・記録・写真がすべて消えます。元に戻せません。</p>', [
      { label: 'やめる' },
      { label: '削除する', cls: 'warn', fn: () => {
        db.users = db.users.filter(x => x !== u);
        if (db.cur === u.id) setUser(db.users[0].id);
        save(); renderSettings(); toast('削除しました');
      } },
    ]);
  });
  $('settingsBody').addEventListener('change', e => {
    const el = e.target, u = userOf(el); if (!u) return;
    if (el.dataset.act === 'lv') {
      const m = el.dataset.m, v = Math.min(MAX_LV, Math.max(1, Number(el.value) || 1));
      u.modes[m] = { lv: v, c: 0 }; recent = []; save(); renderSettings();
      toast(`${MODES[m].sub}を レベル${v}に しました`);
    }
  });
  $('settingsBody').addEventListener('input', e => {
    const el = e.target; if (el.dataset.act !== 'name') return;
    const u = userOf(el); if (!u) return;
    const v = el.value.trim().slice(0, 12);
    if (v) { u.name = v; save(); }
  });
  $('settingsBody').addEventListener('focusout', e => {      // 名前を変えたら、写真のない人の丸の文字を合わせる
    const el = e.target; if (!el.dataset || el.dataset.act !== 'name') return;
    const u = userOf(el); if (!u) return;
    el.value = u.name;
    const pb = el.closest('.ucard').querySelector('.photo-btn'); if (pb) pb.innerHTML = avatar(u);
  });
  $('photoIn').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    const u = db.users.find(x => x.id === photoTarget);
    if (!f || !u) return;
    const url = URL.createObjectURL(f), img = new Image();
    img.onload = () => {                         // 真ん中を正方形に切り抜いて小さくしてから保存
      const S = 192, c = document.createElement('canvas'); c.width = c.height = S;
      const k = Math.min(img.naturalWidth, img.naturalHeight);
      c.getContext('2d').drawImage(img, (img.naturalWidth - k) / 2, (img.naturalHeight - k) / 2, k, k, 0, 0, S, S);
      u.photo = c.toDataURL('image/jpeg', 0.85);
      URL.revokeObjectURL(url); save(); renderSettings();
    };
    img.onerror = () => { URL.revokeObjectURL(url); toast('写真を読み込めませんでした'); };
    img.src = url;
  });

  // ================= ダイアログ・データの書き出し =================
  function dialog(title, html, buttons) {
    const card = $('dlgCard');
    card.innerHTML = `<h3>${title}</h3>${html}<div class="btns" style="justify-content:flex-end"></div>`;
    const row = card.querySelector('.btns');
    buttons.forEach(b => {
      const el = document.createElement('button');
      el.className = 'btn ' + (b.cls || ''); el.textContent = b.label;
      el.addEventListener('click', () => { if (b.keep !== true) $('dlg').classList.remove('show'); if (b.fn) b.fn(card); });
      row.appendChild(el);
    });
    $('dlg').classList.add('show');
  }
  function exportData() {
    const text = JSON.stringify(db);
    dialog('データを書き出す', '<p>下の文字をすべてコピーして、メモなどに保存してください。</p><textarea readonly id="expText"></textarea>', [
      { label: 'コピー', cls: 'pri', keep: true, fn: card => {
        const ta = card.querySelector('textarea'); ta.select();
        const done = () => toast('コピーしました');
        try { navigator.clipboard.writeText(text).then(done, () => { document.execCommand('copy'); done(); }); }
        catch (e) { try { document.execCommand('copy'); done(); } catch (e2) {} }
      } },
      { label: 'とじる' },
    ]);
    $('expText').value = text;
  }
  function importData() {
    dialog('データを読み込む', '<p>書き出した文字を貼り付けてください。今の全員分の進み具合は上書きされます。</p><textarea id="impText"></textarea>', [
      { label: 'やめる' },
      { label: '読み込む', cls: 'pri', keep: true, fn: card => {
        try {
          const obj = JSON.parse(card.querySelector('textarea').value);
          if (!obj || !(obj.users || obj.modes)) throw new Error('bad');
          db = sanitizeDB(obj); st = db.users.find(u => u.id === db.cur); recent = []; recUser = db.cur;
          save(); $('dlg').classList.remove('show'); renderRecords(); renderSound(); toast('読み込みました');
        } catch (e) { toast('読み込めませんでした'); }
      } },
    ]);
  }

  // ================= 拡大・スクロールの防止など =================
  document.addEventListener('touchmove', e => { if (!e.target.closest('.scroll, textarea')) e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 200));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stopTimer();
    else if (screen === 'play' && !busy) startTimer();
  });
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }

  // テスト用（動作確認スクリプトから使う）
  window.__tt = { cfg, makeProblem, transform, canon, get st() { return st; }, get db() { return db; }, get prob() { return prob; } };

  renderSound();
  show(db.users.length > 1 ? 'who' : 'home');
}
</script>
</body>
</html>
